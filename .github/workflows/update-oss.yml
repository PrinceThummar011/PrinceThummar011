name: Update Open Source Contributions

on:
  schedule:
    - cron: "0 0 * * 1"        # every Monday 00:00 UTC (5:30 AM IST)
  workflow_dispatch:            # manual "Run workflow" button
  push:
    paths:
      - "scripts/update_oss.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest      # standard runner = free on public repos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution section
        env:
          GH_USER: PrinceThummar011
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # EXCLUDE: "some-org,owner/some-repo"   # optional: hide orgs/repos
        run: python scripts/update_oss.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update open source contributions" && git push)
